<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bento — standard app shell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0..200&display=block">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
<style>
  /* Shell-page scaffolding only. html/body must be 100% height for the rail's
     "full height is part of the component" rule (components-ext.css) to work —
     see the .hs-rail comment block for what happens if a parent is unsized. */
  html,body{height:100%;margin:0}
  body{background:var(--bento-theme-color-bg-app);font-family:var(--hs-font-body)}
  #app{display:flex;height:100%}
  .content{flex:1;min-width:0;overflow-y:auto;padding:var(--bento-space-06);display:flex;flex-direction:column;gap:var(--bento-space-05)}
  .measure{position:absolute;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#012B3A;color:#fff;padding:2px 6px;border-radius:4px;z-index:5;pointer-events:none;white-space:nowrap}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--bento-space-04)}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════
     REAL MEASUREMENTS (from components-ext.css comments, cross-checked
     against the .hs-rail / .hs-suite-banner / .hs-navdrawer / .hs-header
     rules that ship in this project — not estimated):

       .hs-rail          width  80px   full height of its container
       .hs-suite-banner  min-height 68px, natural height only (flex 0 1 auto),
                         spans from the rail's right edge to the window edge
       .hs-navdrawer     width 288px, sits BELOW the banner (drawer starts at
                         y=68, not y=0 — this is why appcore is a COLUMN:
                         banner on top, [drawer | content] row underneath)
       .hs-header        height 64px (--bento-component-header-height),
                         the in-content page-title bar, separate from the banner
       .hs-appcore / .hs-appbody   the two structural wrapper classes that
                         make this layout possible — see components-ext.css
   ══════════════════════════════════════════════════════════════════════ -->

<div id="app">
  <!-- Rail: 80px, full height, sits to the LEFT of everything including the banner -->
  <nav class="hs-rail" aria-label="Hootsuite products">
    <a class="hs-rail-brand" href="#" aria-label="Hootsuite home">
      <img src="./assets/hootsuite-mark.svg" alt="">
    </a>
    <div class="hs-rail-group">
      <a class="hs-rail-item is-active" data-product="perch" href="#" aria-current="page" title="Perch — Plan &amp; Create">
        <span class="hs-rail-glyph"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span></span>
        <span class="hs-rail-label">Perch</span>
      </a>
      <a class="hs-rail-item" data-product="nest" href="#" title="Nest — Inbox">
        <span class="hs-rail-glyph"><span class="material-symbols-outlined" aria-hidden="true">inbox</span></span>
        <span class="hs-rail-label">Nest</span>
      </a>
      <a class="hs-rail-item" data-product="lumen" href="#" title="Lumen — Listening">
        <span class="hs-rail-glyph"><span class="material-symbols-outlined" aria-hidden="true">graphic_eq</span></span>
        <span class="hs-rail-label">Lumen</span>
      </a>
      <a class="hs-rail-item" data-product="parliament" href="#" title="Parliament — Amplify">
        <span class="hs-rail-glyph"><span class="material-symbols-outlined" aria-hidden="true">groups</span></span>
        <span class="hs-rail-label">Parliament</span>
      </a>
      <a class="hs-rail-item" data-product="wisdom" href="#" title="Wisdom — OwlyGPT">
        <span class="hs-rail-glyph"><span class="material-symbols-outlined" aria-hidden="true">auto_awesome</span></span>
        <span class="hs-rail-label">Wisdom</span>
      </a>
      <a class="hs-rail-item" data-product="vigil" href="#" title="Vigil — Governance">
        <span class="hs-rail-glyph"><span class="material-symbols-outlined" aria-hidden="true">gpp_good</span></span>
        <span class="hs-rail-label">Vigil</span>
      </a>
    </div>
    <div class="hs-rail-spacer"></div>
    <div class="hs-rail-group is-utility">
      <a class="hs-rail-item is-util" href="#" title="Analytics">
        <span class="hs-rail-glyph"><span class="material-symbols-outlined" aria-hidden="true">bar_chart</span></span>
      </a>
      <a class="hs-rail-item is-util" href="#" title="Notifications">
        <span class="hs-rail-glyph"><span class="material-symbols-outlined" aria-hidden="true">notifications_none</span></span>
      </a>
      <a class="hs-rail-item is-util" href="#" title="Account">
        <span class="hs-rail-glyph"><span class="hs-rail-avatar">JD</span></span>
      </a>
    </div>
  </nav>

  <!-- appCore: flex COLUMN — banner (68px) on top, appBody (drawer+content row) below -->
  <section class="hs-appcore">
    <div class="hs-suite-banner" role="region" aria-label="Notifications">
      <!-- Banner internal padding/gap are UNMEASURED anywhere in this system —
           see README "Known gaps". This row's own padding below is ours, not Bento's. -->
      <div style="padding:0 var(--bento-space-05);display:flex;align-items:center;gap:var(--bento-space-03);width:100%;justify-content:space-between">
        <span class="hs-badge hs-badge--info hs-badge--dot">2 organizations syncing</span>
        <button class="hs-btn hs-btn--icon" aria-label="Dismiss"><span class="material-symbols-outlined">close</span></button>
      </div>
    </div>

    <div class="hs-appbody">
      <!-- Nav drawer: 288px, product sub-nav, starts at y=68 (below the banner) -->
      <nav class="hs-navdrawer" aria-label="Perch">
        <div class="hs-navdrawer-head"><h2 class="hs-navdrawer-title">Perch</h2></div>
        <div class="hs-navdrawer-body">
          <div class="hs-navdrawer-section">Plan</div>
          <button type="button" class="hs-navdrawer-item is-active" aria-current="page">
            <span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>
            <span class="hs-navdrawer-item-label">Calendar</span>
          </button>
          <button type="button" class="hs-navdrawer-item">
            <span class="material-symbols-outlined" aria-hidden="true">edit_note</span>
            <span class="hs-navdrawer-item-label">Composer</span>
          </button>
          <button type="button" class="hs-navdrawer-item">
            <span class="material-symbols-outlined" aria-hidden="true">description</span>
            <span class="hs-navdrawer-item-label">Drafts</span>
          </button>
          <div class="hs-navdrawer-section">Grow</div>
          <button type="button" class="hs-navdrawer-item">
            <span class="material-symbols-outlined" aria-hidden="true">campaign</span>
            <span class="hs-navdrawer-item-label">Ads</span>
          </button>
          <button type="button" class="hs-navdrawer-item">
            <span class="material-symbols-outlined" aria-hidden="true">bolt</span>
            <span class="hs-navdrawer-item-label">Boost</span>
          </button>
        </div>
        <div class="hs-navdrawer-footer">
          <button type="button" class="hs-navdrawer-item hs-navdrawer-item--link">
            <span class="material-symbols-outlined" aria-hidden="true">settings</span>
            <span class="hs-navdrawer-item-label">Settings</span>
          </button>
        </div>
      </nav>

      <!-- Content region: no dedicated Bento class ships for this — width/scroll
           behavior here is ours, not a documented token. -->
      <div class="content">
        <div class="hs-header">
          <div class="hs-header-slot"><h2 class="hs-header-title">Calendar</h2></div>
          <div class="hs-header-slot">
            <button class="hs-btn hs-btn--outlined">Filters</button>
            <button class="hs-btn hs-btn--primary">New post</button>
          </div>
        </div>
        <div class="card-grid">
          <div class="hs-card"><strong>12 posts</strong><p class="hs-small">Scheduled this week</p></div>
          <div class="hs-card"><strong>3 drafts</strong><p class="hs-small">Awaiting approval</p></div>
          <div class="hs-card"><strong>4.2%</strong><p class="hs-small">Avg. engagement rate</p></div>
        </div>
      </div>
    </div>
  </section>
</div>

</body>
</html>
